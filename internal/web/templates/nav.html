{{define "nav-style"}}<style>
  body { padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); }
  .bottom-nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(0rem + env(safe-area-inset-bottom)); display: flex; gap: .25rem; padding: .25rem; background: var(--bg); border: 1px solid #ccc; border-radius: 999px; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); }
  .bottom-nav a { display: flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; border-radius: 50%; color: #444; }
  .bottom-nav a[aria-current="page"] { background: var(--accent); color: #fff; }
  .bottom-nav svg { width: 1.4rem; height: 1.4rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @media (pointer: coarse) {
    body:has(input:is([type="text"], [type="search"], [type="number"]):focus, textarea:focus) .bottom-nav { display: none; }
  }
</style>{{end}}

{{define "nav"}}<nav class="bottom-nav" aria-label="Main">
  <a href="/repeating" data-page="repeating" aria-label="Repeating"{{if eq . "repeating"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></a>
  <a href="/" data-page="add" aria-label="Add transaction"{{if eq . "add"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
  <a href="/transactions" data-page="transactions" aria-label="Transactions"{{if eq . "transactions"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></a>
  <a href="/report" data-page="report" aria-label="Report"{{if eq . "report"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg></a>
  <a href="/categories" data-page="categories" aria-label="Edit Categories"{{if eq . "categories"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg></a>
</nav>
<script>
  // Page state: a page with data-page comes back at the address and scroll position it was left at, kept for the browser session.
  // Only a page's own address is recorded (a failed submit answers at its POST target), without the one-off flags.
  // Storage that throws leaves the plain links.
  (function () {
    var oneOff = ['added', 'saved', 'taken', 'name'], leaving = false
    function load(key) { try { return JSON.parse(sessionStorage.getItem('nav:' + key)) } catch (e) { return null } }
    function save(key, value) {
      try { if (value === null) sessionStorage.removeItem('nav:' + key); else sessionStorage.setItem('nav:' + key, JSON.stringify(value)) } catch (e) {}
    }
    function address() {
      var q = new URLSearchParams(location.search)
      oneOff.forEach(function (k) { q.delete(k) })
      return location.pathname + (q.toString() ? '?' + q : '')
    }
    // Forms marked data-carry have their input copied into the page's address when a nav icon is tapped.
    // A form's value prefixes its field names; without one the input is the whole address (the Add page),
    // with one it is added to the address as it is (an open edit next to the filter; the Edit Categories page has two).
    // Disabled fields (those of other Types) are not part of the form data; empty ones are left out.
    function carry() {
      var forms = document.querySelectorAll('form[data-carry]'), page = current && current.dataset.page
      if (!forms.length || !page) return
      var prefixed = forms[0].getAttribute('data-carry') !== ''
      // An edit that failed to apply is shown at its POST target: there is no address to add to.
      if (prefixed && current.pathname !== location.pathname) return
      var q = new URLSearchParams(prefixed ? address().split('?')[1] : '')
      forms.forEach(function (form) {
        var prefix = form.getAttribute('data-carry')
        Array.from(q.keys()).forEach(function (k) { if (prefix && k.indexOf(prefix) === 0) q.delete(k) })
        new FormData(form).forEach(function (v, k) { if (v !== '' && k !== 'return' && k !== 'list') q.append(prefix + k, v) })
      })
      leaving = true
      save(page, { u: current.pathname + '?' + q, y: scrollY })
    }
    var current = document.querySelector('.bottom-nav a[data-page][aria-current]')
    if (current && current.pathname === location.pathname) {
      var page = current.dataset.page, saved = load(page), want = load('restore') === page
      save('restore', null)
      function scrollBack() { if (want && saved && saved.u === address()) scrollTo(0, saved.y) }
      scrollBack()
      // The chart settles its height after this script ran.
      addEventListener('load', scrollBack)
      function record() { if (!leaving) save(page, { u: address(), y: scrollY }) }
      record()
      addEventListener('pagehide', record)
    }
    document.querySelectorAll('.bottom-nav a[data-page]').forEach(function (a) {
      var s = a === current ? null : load(a.dataset.page)
      if (s && typeof s.u === 'string' && s.u.split('?')[0] === a.pathname) a.href = s.u
      a.addEventListener('click', function () {
        if (a === current) { leaving = true; save(a.dataset.page, null); return }
        save('restore', a.dataset.page)
        carry()
      })
    })
  })()
  document.addEventListener('change', function (e) {
    if (e.target.tagName === 'SELECT') e.target.blur();
  });
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('input, select, textarea, button, a, label') && document.activeElement) document.activeElement.blur();
  });
</script>{{end}}
