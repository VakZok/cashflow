<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Repeating · Money Manager</title>
{{template "theme-style"}}
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; }
  input, select, button { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1rem; margin-top: .25rem; }
  button { margin-top: 1rem; }
  .errors { background: #fde8e8; color: #9b1c1c; padding: .5rem 1rem; border-radius: .25rem; }
  .notice { background: #e6f4ea; color: #1e6b34; padding: .5rem 1rem; border-radius: .25rem; }
  .rep-row { border-bottom: 1px solid #ddd; padding: .5rem 0 .75rem; }
  .rep-main { display: grid; grid-template-columns: auto 1fr 1fr; gap: .5rem; align-items: end; }
  .rep-row .remove { width: auto; margin-top: 0; padding: .6rem 1rem; }
  .lists-default, .lists-levy { display: grid; grid-template-columns: 1fr 1fr; column-gap: .5rem; }
  .lists-holding:has(input:not([hidden])) { display: grid; grid-template-columns: 1fr 1fr; column-gap: .5rem; }
  .lists-default[hidden], .lists-levy[hidden] { display: none; }
  .lists-default > :nth-child(1), .lists-levy > :nth-child(1) { grid-column: 1; grid-row: 1; }
  .lists-default > :nth-child(2), .lists-levy > :nth-child(2) { grid-column: 1; grid-row: 2; }
  .lists-default > :nth-child(3), .lists-levy > :nth-child(3) { grid-column: 2; grid-row: 1; }
  .lists-default > :nth-child(4), .lists-levy > :nth-child(4) { grid-column: 2; grid-row: 2; }
  #add-row { display: block; width: auto; margin: 1rem auto 0; padding: .3rem 1rem; }
  input[type=month] { -webkit-appearance: none; appearance: none; min-width: 0; margin-top: 1rem; border: 1px solid #767676; border-radius: .25rem; background: #fff; }
  [hidden] { display: none; }
</style>
{{template "nav-style"}}
</head>
<body>
<h1>Repeating</h1>

<form method="post" action="/repeating">
  <div id="rows">
  {{range .Rows}}{{$row := .}}
  <div class="rep-row">
    <input type="hidden" name="row" value="{{.Index}}">
    <div class="rep-main">
    <button type="button" class="remove" aria-label="Remove row" onclick="removeRow(this.closest('.rep-row'))">−</button>
    <select name="type_{{.Index}}" aria-label="Type" onchange="syncRow(this.closest('.rep-row'))">
      {{range $.Types}}<option value="{{.Type}}"{{if .TakesLevyLists}} data-levy-lists{{end}}{{if .Holding}} data-holding{{end}}{{if eq .Type $row.Type}} selected{{end}}>{{.Label}}</option>{{end}}
    </select>
    <input type="text" inputmode="numeric" name="amount_{{.Index}}" maxlength="9" placeholder="Amount (€)" aria-label="Amount (€)" value="{{.Amount}}" autocomplete="off">
    </div>
    <input type="text" name="description_{{.Index}}" maxlength="100" placeholder="Description" aria-label="Description" value="{{.Description}}"{{if .TakesHolding}} hidden disabled{{end}} autocomplete="off">
    <div class="lists-default"{{if not .TakesDefaultLists}} hidden{{end}}>
    <select name="category_{{.Index}}" aria-label="Category"{{if not .TakesDefaultLists}} disabled{{end}} onchange="this.nextElementSibling.hidden = this.value !== 'new'">
      <option value="">Category…</option>
      {{range $.Categories}}<option value="{{.ID}}"{{if eq (printf "%d" .ID) $row.Category}} selected{{end}}>{{.Name}}</option>{{end}}
      <option value="new"{{if eq .Category "new"}} selected{{end}}>new…</option>
    </select>
    <input type="text" name="new_category_{{.Index}}" maxlength="50" placeholder="New category name" aria-label="New category name" value="{{.NewCategory}}"{{if ne .Category "new"}} hidden{{end}}{{if not .TakesDefaultLists}} disabled{{end}}>
    <select name="subcategory_{{.Index}}" aria-label="Subcategory"{{if not .TakesDefaultLists}} disabled{{end}} onchange="this.nextElementSibling.hidden = this.value !== 'new'">
      <option value="">Subcategory…</option>
      {{range $.Subcategories}}<option value="{{.ID}}"{{if eq (printf "%d" .ID) $row.Subcategory}} selected{{end}}>{{.Name}}</option>{{end}}
      <option value="new"{{if eq .Subcategory "new"}} selected{{end}}>new…</option>
    </select>
    <input type="text" name="new_subcategory_{{.Index}}" maxlength="50" placeholder="New subcategory name" aria-label="New subcategory name" value="{{.NewSubcategory}}"{{if ne .Subcategory "new"}} hidden{{end}}{{if not .TakesDefaultLists}} disabled{{end}}>
    </div>
    <div class="lists-levy"{{if not .TakesLevyLists}} hidden{{end}}>
    <select name="levy_category_{{.Index}}" aria-label="Levy Category"{{if not .TakesLevyLists}} disabled{{end}} onchange="this.nextElementSibling.hidden = this.value !== 'new'">
      <option value="">Levy Category…</option>
      {{range $.LevyCategories}}<option value="{{.ID}}"{{if eq (printf "%d" .ID) $row.LevyCategory}} selected{{end}}>{{.Name}}</option>{{end}}
      <option value="new"{{if eq .LevyCategory "new"}} selected{{end}}>new…</option>
    </select>
    <input type="text" name="new_levy_category_{{.Index}}" maxlength="50" placeholder="New levy category name" aria-label="New levy category name" value="{{.NewLevyCategory}}"{{if ne .LevyCategory "new"}} hidden{{end}}{{if not .TakesLevyLists}} disabled{{end}}>
    <select name="levy_subcategory_{{.Index}}" aria-label="Levy Subcategory"{{if not .TakesLevyLists}} disabled{{end}} onchange="this.nextElementSibling.hidden = this.value !== 'new'">
      <option value="">Levy Subcategory…</option>
      {{range $.LevySubcategories}}<option value="{{.ID}}"{{if eq (printf "%d" .ID) $row.LevySubcategory}} selected{{end}}>{{.Name}}</option>{{end}}
      <option value="new"{{if eq .LevySubcategory "new"}} selected{{end}}>new…</option>
    </select>
    <input type="text" name="new_levy_subcategory_{{.Index}}" maxlength="50" placeholder="New levy subcategory name" aria-label="New levy subcategory name" value="{{.NewLevySubcategory}}"{{if ne .LevySubcategory "new"}} hidden{{end}}{{if not .TakesLevyLists}} disabled{{end}}>
    </div>
    <div class="lists-holding"{{if not .TakesHolding}} hidden{{end}}>
    <select name="holding_{{.Index}}" aria-label="Holding"{{if not .TakesHolding}} disabled{{end}} onchange="this.nextElementSibling.hidden = this.value !== 'new'">
      <option value="">Holding…</option>
      {{range $.Holdings}}<option value="{{.ID}}"{{if eq (printf "%d" .ID) $row.Holding}} selected{{end}}>{{.Name}}</option>{{end}}
      <option value="new"{{if eq .Holding "new"}} selected{{end}}>new…</option>
    </select>
    <input type="text" name="new_holding_{{.Index}}" maxlength="50" placeholder="New holding name" aria-label="New holding name" value="{{.NewHolding}}"{{if ne .Holding "new"}} hidden{{end}}{{if not .TakesHolding}} disabled{{end}}>
    </div>
  </div>
  {{end}}
  </div>

  <button type="button" id="add-row" aria-label="Add row" onclick="addRow()">+</button>

  <input id="date" type="month" name="date" aria-label="Month" value="{{if ge (len .Date) 7}}{{slice .Date 0 7}}{{end}}">
  <button class="primary" type="submit" name="action" value="save">Save List</button>
  <button class="primary" type="submit" name="action" value="add">Add Transactions</button>
</form>

{{with .Errors}}
<div class="errors" role="alert"><ul>{{range .}}<li>{{.}}</li>{{end}}</ul></div>
{{end}}
{{if .Notice}}<div class="notice" role="status">{{.Notice}}</div>{{end}}

<script>
var maxRows = {{.MaxRows}};
var nextIndex = {{len .Rows}};
var rowsEl = document.getElementById('rows');
function resetRow(row, index) {
  row.querySelectorAll('input, select').forEach(function (el) {
    if (el.name === 'row') { el.value = index; return; }
    el.name = el.name.replace(/_\d+$/, '_' + index);
    if (el.tagName === 'SELECT') { el.selectedIndex = 0; }
    else { el.value = ''; if (el.name.indexOf('new_') === 0) { el.hidden = true; } }
  });
}
// Shows the list group the row's Type takes and disables the other, so only
// the visible one is submitted.
function syncRow(row) {
  var type = row.querySelector('select[name^="type_"]');
  var levy = type.selectedOptions[0].hasAttribute('data-levy-lists');
  var holding = type.selectedOptions[0].hasAttribute('data-holding');
  var description = row.querySelector('input[name^="description_"]');
  description.hidden = description.disabled = holding;
  [['lists-default', !levy && !holding], ['lists-levy', levy], ['lists-holding', holding]].forEach(function (g) {
    var group = row.querySelector('.' + g[0]);
    group.hidden = !g[1];
    group.querySelectorAll('input, select').forEach(function (el) { el.disabled = !g[1]; });
  });
}
function syncAdd() {
  document.getElementById('add-row').disabled = rowsEl.children.length >= maxRows;
}
function addRow() {
  if (rowsEl.children.length >= maxRows) { return; }
  var row = rowsEl.lastElementChild.cloneNode(true);
  resetRow(row, nextIndex++);
  syncRow(row);
  rowsEl.appendChild(row);
  syncAdd();
}
function removeRow(row) {
  // The list always keeps one row; removing the last one blanks it.
  if (rowsEl.children.length === 1) { resetRow(row, nextIndex++); syncRow(row); }
  else { rowsEl.removeChild(row); }
  syncAdd();
}
syncAdd();
</script>
{{template "nav" "repeating"}}
</body>
</html>
