{{/* theme-style is the shared palette. Pages include it before their own style, so page rules such as button.armed win over it. */}}
{{define "theme-style"}}<style>
  :root { --bg: #f0eee6; --accent: #c15f3c; }
  body { background: var(--bg); }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: .5rem; }
</style>{{end}}
