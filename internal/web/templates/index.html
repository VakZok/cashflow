<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Manager</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem; }
  label { display: block; margin-top: .75rem; font-weight: 600; }
  input, select, button { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1rem; margin-top: .25rem; }
  button { margin-top: 1rem; }
  .errors { background: #fde8e8; color: #9b1c1c; padding: .5rem 1rem; border-radius: .25rem; }
  ul.transactions { list-style: none; padding: 0; }
  ul.transactions li { padding: .6rem 0; border-bottom: 1px solid #ddd; display: grid; grid-template-columns: 1fr auto; gap: .1rem .5rem; }
  .amount { font-weight: 700; text-align: right; }
  .meta { color: #666; font-size: .9rem; grid-column: 1 / -1; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>Money Manager</h1>

<h2>Add Expense</h2>
{{with .Form.Errors}}
<div class="errors" role="alert"><ul>{{range .}}<li>{{.}}</li>{{end}}</ul></div>
{{end}}
<form method="post" action="/transactions">
  <label for="date">Date</label>
  <input id="date" type="date" name="date" value="{{.Form.Date}}">

  <label for="amount">Amount (€)</label>
  <input id="amount" type="text" inputmode="numeric" name="amount" value="{{.Form.Amount}}" autocomplete="off">

  <label for="description">Description</label>
  <input id="description" type="text" name="description" value="{{.Form.Description}}" autocomplete="off">

  <label for="category">Category</label>
  <select id="category" name="category" onchange="document.getElementById('new_category').hidden = this.value !== 'new'">
    <option value="">Choose…</option>
    {{range .Categories}}<option value="{{.ID}}"{{if eq (printf "%d" .ID) $.Form.Category}} selected{{end}}>{{.Name}}</option>{{end}}
    <option value="new"{{if eq .Form.Category "new"}} selected{{end}}>new…</option>
  </select>
  <input id="new_category" type="text" name="new_category" placeholder="New category name" value="{{.Form.NewCategory}}"{{if ne .Form.Category "new"}} hidden{{end}}>

  <label for="subcategory">Subcategory</label>
  <select id="subcategory" name="subcategory" onchange="document.getElementById('new_subcategory').hidden = this.value !== 'new'">
    <option value="">Choose…</option>
    {{range .Subcategories}}<option value="{{.ID}}"{{if eq (printf "%d" .ID) $.Form.Subcategory}} selected{{end}}>{{.Name}}</option>{{end}}
    <option value="new"{{if eq .Form.Subcategory "new"}} selected{{end}}>new…</option>
  </select>
  <input id="new_subcategory" type="text" name="new_subcategory" placeholder="New subcategory name" value="{{.Form.NewSubcategory}}"{{if ne .Form.Subcategory "new"}} hidden{{end}}>

  <button type="submit">Add Expense</button>
</form>

<h2>Transactions</h2>
<ul class="transactions">
{{range .Transactions}}
  <li>
    <span>{{.Description}}</span>
    <span class="amount">{{euro .Amount}}</span>
    <span class="meta">{{.Date}} · {{.Category}} · {{.Subcategory}}</span>
  </li>
{{else}}
  <li>No Transactions yet.</li>
{{end}}
</ul>
</body>
</html>
